services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    image: golang:1.25
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      EVO_HTTP_ADDR: :8080
      EVO_DATABASE_URL: postgres://postgres@postgres:5432/postgres?sslmode=disable
      EVO_OBJECT_STORE: fs
      EVO_ARTIFACT_ROOT: /workspace/services/controlplane/data/artifacts
    command: /bin/sh -lc "go run ./services/controlplane/cmd/api"
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"

  worker:
    image: golang:1.25
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      EVO_DATABASE_URL: postgres://postgres@postgres:5432/postgres?sslmode=disable
      EVO_OBJECT_STORE: fs
      EVO_ARTIFACT_ROOT: /workspace/services/controlplane/data/artifacts
    command: /bin/sh -lc "go run ./services/controlplane/cmd/worker"
    depends_on:
      - api

  chatgpt-app:
    image: node:25
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      EVO_API_BASE_URL: http://api:8080
    command: /bin/sh -lc "corepack enable && pnpm install && pnpm --filter @evo/chatgpt-app dev"
    depends_on:
      - api
    ports:
      - "3200:3200"

  console:
    image: node:25
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      EVO_API_BASE_URL: http://api:8080
    command: /bin/sh -lc "corepack enable && pnpm install && pnpm --filter @evo/console dev -- --host 0.0.0.0"
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  minio-data:
